name: Check releasable distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Enforce component authorization and build
        run: python scripts/build_distribution.py --mode release
      # This workflow intentionally does not publish or upload artifacts.
      # It fails until every included component has a documented distribution grant.
