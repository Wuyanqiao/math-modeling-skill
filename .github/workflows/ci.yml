name: Validate workbench

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install declared development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python regression suite
        run: python -m unittest discover -s tests -v
      - name: DOCX compatibility self-check
        run: python tools/docx/scripts/self_check.py
      - name: Python source compilation
        run: python -m compileall -q mathmodel_runtime scripts tools references/roles/编程手/scripts
      - name: DSH adapter regression suite
        shell: bash
        run: node --test tests/dsh/*.test.mjs
      - name: Check generated local DSH resources
        run: python scripts/sync_dsh_plugin.py --check
      - name: Build and smoke-test local development distributions
        run: python scripts/build_distribution.py --mode local-development --output dist/local-validation
      - name: Build local runtime wheel
        run: python -m build --wheel --outdir dist/runtime
      - name: Verify wheel outside the checkout with no optional packages
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, tempfile, venv
          wheel = next(pathlib.Path("dist/runtime").resolve().glob("*.whl"))
          with tempfile.TemporaryDirectory(prefix="wheel 独立验证 ") as temporary:
              root = pathlib.Path(temporary).resolve()
              environment = root / "venv"
              venv.EnvBuilder(with_pip=True).create(environment)
              python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run([str(python), "-m", "pip", "install", "--no-index", "--no-deps", str(wheel)], cwd=root, check=True)
              project = root / "项目 with spaces"
              project.mkdir()
              for action in ("init", "state", "complete"):
                  options = {"profile": "short", "scope": "modeling"} if action == "init" else {}
                  run = subprocess.run([str(python), "-I", "-m", "mathmodel_runtime", action, "--project-root", str(project), "--options", json.dumps(options)], cwd=root, check=True, capture_output=True, text=True, encoding="utf-8")
                  report = json.loads(run.stdout)
                  assert report["ok"] and not report.get("done", False), report
                  print(action, "passed")
          PY
      # Restricted/unverified local-development bundles are deliberately not uploaded.

  node-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/dsh/*.test.mjs

  preset-host:
    name: DSH preset host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.13"
      - name: Install Windows sandbox probe dependencies
        if: runner.os == 'Windows'
        run: python -m pip install "numpy>=1.26,<3" "matplotlib>=3.8,<4"
      - name: Prepare isolated host dependencies
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          const prefix = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'mathmodel-preset-ci-'))
          fs.appendFileSync(process.env.GITHUB_ENV,
            `DSH_TEST_NPM_PREFIX=${prefix}\nDSH_TEST_NODE_MODULES=${path.join(prefix, 'node_modules')}\n`)
          JS
      - name: Install pinned official host packages
        run: |
          npm install --prefix "$DSH_TEST_NPM_PREFIX" --ignore-scripts --no-audit --no-fund --save-exact \
            @deepseek-ai/dsh@0.1.7-alpha.1 \
            @deepseek-ai/cordis@4.0.3 \
            @deepseek-ai/schemastery@3.18.3
      - name: Require installed host and run actual preset registry regression
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import path from 'node:path'
          const modules = process.env.DSH_TEST_NODE_MODULES
          assert.ok(modules && path.isAbsolute(modules), 'An absolute host dependency path is required; this job cannot skip')
          for (const [name, version] of Object.entries({ dsh: '0.1.7-alpha.1', cordis: '4.0.3', schemastery: '3.18.3' })) {
            const installed = JSON.parse(fs.readFileSync(path.join(modules, '@deepseek-ai', name, 'package.json'), 'utf8'))
            assert.equal(installed.version, version, `Unexpected ${name} version`)
          }
          JS
          node --test --test-reporter=tap tests/dsh/preset-host.test.mjs | tee preset-host.tap
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const report = fs.readFileSync('preset-host.tap', 'utf8')
          assert.match(report, /^# tests [1-9][0-9]*\r?$/m, 'The actual host test must execute')
          assert.match(report, /^# fail 0\r?$/m, 'The host test must pass')
          assert.match(report, /^# skipped 0\r?$/m, 'Skipped host tests must fail this job')
          JS
      - name: Require actual session controller start regression
        run: |
          set -euo pipefail
          node --test --test-reporter=tap tests/dsh/start-host.test.mjs | tee start-host.tap
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const report = fs.readFileSync('start-host.tap', 'utf8')
          assert.match(report, /^# tests [1-9][0-9]*\r?$/m, 'The actual session controller test must execute')
          assert.match(report, /^# fail 0\r?$/m, 'The session controller test must pass')
          assert.match(report, /^# skipped 0\r?$/m, 'Skipped session controller tests must fail this job')
          JS
      - name: Require actual Windows restricted sandbox environment regression
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          python -c "import sys; assert sys.version_info[:2] == (3, 13), sys.version"
          node --test --test-reporter=tap tests/dsh/environment-sandbox.test.mjs | tee environment-sandbox.tap
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const report = fs.readFileSync('environment-sandbox.tap', 'utf8')
          assert.match(report, /^# tests [1-9][0-9]*\r?$/m, 'The actual Windows sandbox test must execute')
          assert.match(report, /^# pass [1-9][0-9]*\r?$/m, 'The actual Windows sandbox test must pass')
          assert.match(report, /^# fail 0\r?$/m, 'The sandbox regression must not fail')
          assert.match(report, /^# skipped 0\r?$/m, 'Skipped sandbox tests must fail this Windows job')
          JS
      - name: Require actual Windows workspace initialization regression
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          node --test --test-reporter=tap tests/dsh/workspace-init-sandbox.test.mjs | tee workspace-init-sandbox.tap
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const report = fs.readFileSync('workspace-init-sandbox.tap', 'utf8')
          assert.match(report, /^# tests [1-9][0-9]*\r?$/m, 'The actual Windows initialization test must execute')
          assert.match(report, /^# pass [1-9][0-9]*\r?$/m, 'The actual Windows initialization test must pass')
          assert.match(report, /^# fail 0\r?$/m, 'The workspace initialization regression must not fail')
          assert.match(report, /^# skipped 0\r?$/m, 'Skipped initialization tests must fail this Windows job')
          JS
