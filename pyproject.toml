[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathmodel-workbench"
dynamic = ["version"]
description = "Evidence-based local workflow for mathematical modeling projects"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1,<2", "lxml>=5,<7", "defusedxml>=0.7.1,<1", "Pillow>=10,<13"]
figure = ["numpy>=1.26,<3", "pandas>=2.2,<4", "matplotlib>=3.8,<4", "Pillow>=10,<13"]
pdf = ["pypdf>=5,<7", "PyMuPDF>=1.24,<2"]
xlsx = ["openpyxl>=3.1,<4"]
validation = ["jsonschema>=4.21,<5"]
science = ["numpy>=1.26,<3", "scipy>=1.12,<2", "pandas>=2.2,<4", "networkx>=3.2,<4", "scikit-learn>=1.4,<2"]
dev = [
  "python-docx>=1.1,<2", "lxml>=5,<7", "defusedxml>=0.7.1,<1",
  "Pillow>=10,<13", "pypdf>=5,<7", "PyMuPDF>=1.24,<2",
  "jsonschema>=4.21,<5", "numpy>=1.26,<3", "pandas>=2.2,<4",
  "matplotlib>=3.8,<4", "scipy>=1.12,<2", "networkx>=3.2,<4",
  "openpyxl>=3.1,<4", "scikit-learn>=1.4,<2", "build>=1.2,<2",
]

[project.scripts]
mathmodel = "mathmodel_runtime.cli:main"

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.packages.find]
include = ["mathmodel_runtime*"]

[tool.setuptools.package-data]
mathmodel_runtime = ["resources/schemas/*.json", "resources/profiles/*.json"]
